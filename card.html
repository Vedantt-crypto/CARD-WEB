<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glass Cards Tilt</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Poppins;
}

body{
    min-height:100vh;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
}

/* BACK BLOBS - SHARP */
.blob{
    position:absolute;
    width:350px;
    height:350px;
    border-radius:50%;
    opacity:.8;
    z-index:0;
}
.red{
    background:#ff0000; /* sharp red */
    top:15%;
    left:15%;
    box-shadow: 0 20px 60px rgba(255,0,0,0.6), 0 0 100px rgba(255,0,0,0.3); /* shadow/glow */
}

.blue{
    background:#2753da; /* sharp blue */
    bottom:15%;
    right:15%;
    box-shadow: 0 20px 60px rgba(2, 61, 238, 0.6), 0 0 100px rgba(0,64,255,0.3); /* shadow/glow */
}


/* CARD CONTAINER */
.container{
    display:flex;
    gap:50px;
    perspective:1200px;
    z-index:2;
}

/* CARD */
.card{
    width:280px;
    height:360px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    border-radius:20px;
    border:1px solid rgba(255,255,255,0.18);
    box-shadow:0 25px 60px rgba(0,0,0,0.7);
    color:#fff;
    padding:25px;
    text-align:center;
    transform-style:preserve-3d;
    transition:transform .15s ease;
    position:relative;
}

/* CARD BLUR MASK (BLUR BEHIND CARD ONLY) */
.card::before{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(30px); /* only behind card */
    border-radius:20px;
    z-index:-1;
}

/* PROFILE */
.card img{
    width:80px;
    height:80px;
    border-radius:50%;
    margin-bottom:15px;
    transform:translateZ(50px);
}

.card h3{
    margin-bottom:10px;
    letter-spacing:1px;
    transform:translateZ(40px);
}

.card p{
    font-size:13px;
    color:#ddd;
    line-height:1.6;
    transform:translateZ(30px);
}

/* ICONS */
.icons{
    position:absolute;
    bottom:20px;
    width:100%;
    left:0;
    display:flex;
    justify-content:center;
    gap:18px;
    transform:translateZ(35px);
}

.icons span{
    opacity:.8;
    cursor:pointer;
}

/* MOBILE */
@media(max-width:900px){
    .container{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<!-- BACK SHARP GLOWS -->
<div class="blob red"></div>
<div class="blob blue"></div>

<div class="container">

<div class="card">
    <img src="https://i.pravatar.cc/100?img=12">
    <h3>PERSON NAME</h3>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
    <div class="icons">
        <span>🌐</span><span>🐦</span><span>▶</span>
    </div>
</div>

<div class="card">
    <img src="https://i.pravatar.cc/100?img=32">
    <h3>PERSON NAME</h3>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
    <div class="icons">
        <span>🌐</span><span>🐦</span><span>▶</span>
    </div>
</div>

<div class="card">
    <img src="https://i.pravatar.cc/100?img=45">
    <h3>PERSON NAME</h3>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit.</p>
    <div class="icons">
        <span>🌐</span><span>🐦</span><span>▶</span>
    </div>
</div>

</div>

<script>
/* 3D TILT EXACT SCREENSHOT FEEL */
document.querySelectorAll(".card").forEach(card=>{
    card.addEventListener("mousemove",e=>{
        const rect = card.getBoundingClientRect();
        let x = e.clientX - rect.left;
        let y = e.clientY - rect.top;

        let rotateX = -(y - rect.height/2) / 10;
        let rotateY = (x - rect.width/2) / 10;

        card.style.transform =
            `rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale(1.05)`;
    });

    card.addEventListener("mouseleave",()=>{
        card.style.transform =
            "rotateX(0deg) rotateY(0deg) scale(1)";
    });
});
</script>

</body>
</html>
